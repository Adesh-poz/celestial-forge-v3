name: celestial_forge
description: "A beautifully nerdy Flutter app to explore and draw perks from the **Celestial Forge v3**, a cosmic Swiss Army Knife of powerful perks, broken mechanics, and the Ultimate Power Creep."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8           # Automatically added by Flutter
  google_fonts: ^6.3.3              # For Google Fonts
  flutter_spinkit: ^5.2.1           # For Loading Indicator
  flutter_riverpod: ^2.6.1          # State Management 
  flutter_launcher_icons: ^0.14.4   # App Icon Generation
  hive: ^2.2.3                      # Local Storage for CP and Perks Owned
  hive_flutter: ^1.1.0              # Dependency of the 'hive'


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1            # Dependency of the 'hive'
  build_runner: ^2.4.6              # Dependency of the 'hive'

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
